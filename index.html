<!DOCTYPE html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五年级历史 单元11 - 国语的功用与地位</title>
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --secondary: #FD79A8;
      --accent: #FFEAA7;
      --bg: #F8F9FA;
      --text: #2D3436;
      --white: #FFFFFF;
      --shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Microsoft YaHei, sans-serif; }
    body { background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; color: var(--text); }
    
    .card { background: var(--white); border-radius: 24px; padding: 30px; width: 100%; max-width: 680px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 24px; color: var(--primary); margin-bottom: 5px; }
    .header p { color: #636e72; font-size: 14px; }
    
    .btn-teacher { position: absolute; top: 15px; right: 15px; background: rgba(108, 92, 231, 0.1); border: none; padding: 8px 12px; border-radius: 12px; cursor: pointer; color: var(--primary); font-size: 12px; font-weight: bold; transition: all 0.2s; }
    .btn-teacher:hover { background: var(--primary); color: var(--white); }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #4b6584; }
    .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e1e8ef; border-radius: 12px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--primary); }

    .btn { width: 100%; padding: 14px; background: var(--primary); color: var(--white); border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s; box-shadow: var(--shadow); }
    .btn:hover { background: #5b4bc4; }
    .btn:active { transform: scale(0.98); }

    .quiz-box { display: none; }
    .q-count { color: var(--primary); font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    .q-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: #2d3436; }
    
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { width: 100%; text-align: left; padding: 14px 18px; background: #f1f2f6; border: 2px solid transparent; border-radius: 12px; font-size: 15px; cursor: pointer; transition: all 0.2s; }
    .opt-btn:hover { background: #dfe4ea; }
    .opt-btn.correct { background: #55efc4 !important; color: #00b894; border-color: #00b894; font-weight: bold; }
    .opt-btn.wrong { background: #ff7675 !important; color: #d63031; border-color: #d63031; font-weight: bold; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--white); padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; text-align: center; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #dfe4ea; padding: 8px; text-align: left; }
    th { background: var(--primary-light); color: white; }
    
    .error-msg { color: #d63031; font-size: 12px; margin-top: 4px; display: none; }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEj7oJnkY71_alcIQYQgFaGgVerQph41s",
      authDomain: "sejarah-quiz-unit-11.firebaseapp.com",
      projectId: "sejarah-quiz-unit-11",
      storageBucket: "sejarah-quiz-unit-11.firebasestorage.app",
      messagingSenderId: "121616959808",
      appId: "1:121616959808:web:b48eb598bd12289eef92a5",
      measurementId: "G-C348TYFFL2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 全局暴露 Firebase 函数
    window.saveToFirebase = async function(data) {
      try {
        await addDoc(collection(db, "quiz_results"), data);
        console.log("Firebase 提交成功");
      } catch (e) {
        console.error("Firebase 保存失败: ", e);
      }
    };

    window.loadFromFirebase = async function() {
      try {
        const q = query(collection(db, "quiz_results"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        let list = [];
        querySnapshot.forEach((doc) => {
          list.push(doc.data());
        });
        return list;
      } catch (e) {
        console.error("加载 Firebase 失败: ", e);
        return [];
      }
    };
  </script>
</head>
<body>

  <div class="card">
    <button class="btn-teacher" onclick="openTeacherModal()">🔒 教师后台</button>

    <!-- 登录界面 -->
    <div id="start-screen">
      <div class="header">
        <h1>五角星历史小达人</h1>
        <p>单元 11：国语的功用与地位</p>
      </div>
      <div class="form-group">
        <label>学生姓名 (Name)</label>
        <input type="text" id="stu-name" placeholder="请输入你的中英文姓名">
        <div class="error-msg" id="name-err">请填写姓名</div>
      </div>
      <div class="form-group">
        <label>MOE 邮箱账号 (MOE Email)</label>
        <input type="email" id="stu-email" placeholder="例: m-12345678@moe-dl.edu.my">
        <div class="error-msg" id="email-err">邮箱格式必须以 @moe-dl.edu.my 结尾</div>
      </div>
      <button class="btn" onclick="startQuiz()">🚀 开始挑战</button>
    </div>

    <!-- 答题界面 -->
    <div id="quiz-screen" class="quiz-box">
      <div class="q-count" id="q-idx">第 1 / 10 题</div>
      <div class="q-text" id="q-text">问题内容...</div>
      <div class="options" id="options-box"></div>
    </div>

    <!-- 结算界面 -->
    <div id="result-screen" class="quiz-box" style="text-align: center;">
      <div class="header">
        <h1>🎉 挑战完成！</h1>
        <p id="score-text" style="font-size: 20px; font-weight: bold; color: var(--primary); margin: 15px 0;"></p>
      </div>
      <button class="btn" onclick="location.reload()">重新挑战</button>
    </div>
  </div>

  <!-- 教师验证弹窗 -->
  <div class="modal" id="login-modal">
    <div class="modal-content">
      <h3>教师身份验证</h3>
      <input type="password" id="pwd-input" placeholder="密码" style="width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px;">
      <button class="btn" onclick="checkPwd()">登录</button>
    </div>
  </div>

  <!-- 教师后台数据弹窗 -->
  <div class="modal" id="teacher-modal">
    <div class="modal-content" style="max-width: 650px;">
      <h3>全班成绩后台 (Firebase 云端同步)</h3>
      <div style="margin: 10px 0; text-align: right;">
        <button onclick="exportCSV()" style="padding: 6px 12px; background: #00b894; color: white; border: none; border-radius: 6px; cursor: pointer;">📥 导出 Excel/CSV</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>姓名</th>
            <th>MOE 账号</th>
            <th>得分</th>
            <th>提交时间</th>
          </tr>
        </thead>
        <tbody id="teacher-table"></tbody>
      </table>
      <button class="btn" onclick="closeModals()" style="margin-top: 15px; background: #636e72;">关闭</button>
    </div>
  </div>

<script>
  const questions = [
    { q: "根据《马来西亚联邦宪法》第152条文，马来语的地位是什么？", opts: ["官方语言", "国语与官方语言", "第二语言", "区域语言"], a: 1 },
    { q: "国语在行政事务中的主要作用是什么？", opts: ["仅用于商业", "官方正式沟通与公文语言", "仅在学校教学", "私人交流"], a: 1 },
    { q: "国语促进种族团结的主要原因是？", opts: ["它是唯一的语言", "作为共同的沟通桥梁", "它是最容易学的语言", "法律强制要求"], a: 1 },
    { q: "以下哪项是国语作为商业语言的体现？", opts: ["签署官方商业契约与合同", "只在市场买菜使用", "国际贸易唯一语言", "不能在商业中使用"], a: 0 },
    { q: "马来西亚哪部法律保障了国语作为官方语言的地位？", opts: ["《教育法案》", "《联邦宪法》", "《国家安全法》", "《劳动法》"], a: 1 },
    { q: "国语在教育领域扮演什么角色？", opts: ["主要教学媒介语之一", "外语课程", "可选修科目", "仅用于体育课"], a: 0 },
    { q: "建立国语的权威性有助于提升什么？", opts: ["个人知名度", "国家形象与尊严", "旅游收入", "科技发展"], a: 1 },
    { q: "国家语文局（DBP）的主要职责是什么？", opts: ["推广与规范国语的使用", "修改国家宪法", "管理全国学校", "出版所有商业书籍"], a: 0 },
    { q: "每年的“国语月”活动旨在？", opts: ["举行体育比赛", "提高国民对国语的热爱与掌握", "庆祝节日", "推广外语学习"], a: 1 },
    { q: "身为马来西亚公民，我们应该如何对待国语？", opts: ["仅在考试时使用", "尊重、学习并自豪地使用国语", "忽略它", "只在家里使用"], a: 1 }
  ];

  let currentQ = 0;
  let score = 0;
  let stuName = "";
  let stuEmail = "";
  let cachedData = [];

  function startQuiz() {
    stuName = document.getElementById('stu-name').value.trim();
    stuEmail = document.getElementById('stu-email').value.trim().toLowerCase();
    
    let valid = true;
    if(!stuName) { document.getElementById('name-err').style.display = 'block'; valid = false; }
    else { document.getElementById('name-err').style.display = 'none'; }

    if(!stuEmail.endsWith('@moe-dl.edu.my')) { document.getElementById('email-err').style.display = 'block'; valid = false; }
    else { document.getElementById('email-err').style.display = 'none'; }

    if(!valid) return;

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    showQuestion();
  }

  function showQuestion() {
    const q = questions[currentQ];
    document.getElementById('q-idx').innerText = `第 ${currentQ + 1} / ${questions.length} 题`;
    document.getElementById('q-text').innerText = q.q;
    
    const optsBox = document.getElementById('options-box');
    optsBox.innerHTML = '';
    q.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt;
      btn.onclick = () => selectOpt(idx, btn);
      optsBox.appendChild(btn);
    });
  }

  function selectOpt(idx, btn) {
    const q = questions[currentQ];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if(idx === q.a) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      btns[q.a].classList.add('correct');
    }

    setTimeout(() => {
      currentQ++;
      if(currentQ < questions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }, 1200);
  }

  function finishQuiz() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('score-text').innerText = `${stuName}，你的得分：${score} / ${questions.length}`;
    
    const data = {
      name: stuName,
      email: stuEmail,
      score: score,
      time: new Date().toLocaleString('zh-MY'),
      timestamp: Date.now()
    };

    // 本地备份
    let local = JSON.parse(localStorage.getItem('history_scores') || '[]');
    local.unshift(data);
    localStorage.setItem('history_scores', JSON.stringify(local));

    // Firebase 保存
    if (window.saveToFirebase) {
      window.saveToFirebase(data);
    }
  }

  function openTeacherModal() {
    document.getElementById('login-modal').style.display = 'flex';
  }

  function checkPwd() {
    const pwd = document.getElementById('pwd-input').value;
    if(pwd === '2020Hui%%') {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('teacher-modal').style.display = 'flex';
      loadTeacherData();
    } else {
      alert('密码错误！');
    }
  }

  async function loadTeacherData() {
    const tbody = document.getElementById('teacher-table');
    tbody.innerHTML = '<tr><td colspan="4">加载 Firebase 数据中...</td></tr>';

    if (window.loadFromFirebase) {
      let cloudList = await window.loadFromFirebase();
      if (cloudList && cloudList.length > 0) {
        cachedData = cloudList;
        renderTable(cloudList);
        return;
      }
    }
    
    // 如果云端为空或异常，尝试加载本地
    cachedData = JSON.parse(localStorage.getItem('history_scores') || '[]');
    renderTable(cachedData);
  }

  function renderTable(list) {
    const tbody = document.getElementById('teacher-table');
    tbody.innerHTML = '';
    if(!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">暂无提交记录</td></tr>';
      return;
    }
    list.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${item.name}</td><td>${item.email}</td><td>${item.score}/10</td><td>${item.time}</td>`;
      tbody.appendChild(tr);
    });
  }

  function exportCSV() {
    let list = cachedData.length > 0 ? cachedData : JSON.parse(localStorage.getItem('history_scores') || '[]');
    let csv = "\uFEFF姓名,MOE账号,得分,提交时间\n";
    list.forEach(r => { csv += `"${r.name}","${r.email}","${r.score}","${r.time}"\n`; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "五年级历史单元11学生成绩.csv";
    link.click();
  }

  function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
  }
</script>
</body>
</html>
