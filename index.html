    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global App ID and Config handle
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'history-unit11-quiz';
        let db = null;
        let auth = null;
        let isCloudAvailable = false;

        // Initialize Cloud Firebase if environment supports it
        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate first before Firestore operations
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        isCloudAvailable = true;
                        listenToLeaderboard();
                    } catch (err) {
                        console.warn("Cloud Auth Notice:", err);
                        fallbackLocalLeaderboard();
                    }
                };
                initAuth();
            } else {
                fallbackLocalLeaderboard();
            }
        } catch (e) {
            console.warn("Cloud Init fallback:", e);
            fallbackLocalLeaderboard();
        }

        // Live Cloud Leaderboard Listener
        function listenToLeaderboard() {
            if (!db || !isCloudAvailable) return;

            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            // Listen to changes in real-time
            onSnapshot(collectionRef, (snapshot) => {
                let leaderboardData = [];
                snapshot.forEach((docSnap) => {
                    leaderboardData.push(docSnap.data());
                });

                // Sort descending by score, then timestamp
                leaderboardData.sort((a, b) => b.score - a.score || (b.timestamp || 0) - (a.timestamp || 0));

                window.renderLeaderboardUI(leaderboardData, "cloud");
            }, (error) => {
                console.error("Leaderboard Snapshot error:", error);
                fallbackLocalLeaderboard();
            });
        }

        // Save Score to Cloud & Local Storage
        window.saveScoreToCloud = async function(name, moeAccount, userScore) {
            const cleanName = name.trim();
            const cleanMoe = (moeAccount || '').trim();
            
            const record = {
                name: cleanName,
                moe: cleanMoe, // Stored securely in database record
                score: userScore,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now()
            };

            // 1. Always save locally as backup
            let localList = JSON.parse(localStorage.getItem('history_unit11_leaderboard') || '[]');
            const existingIndex = localList.findIndex(item => item.name.toLowerCase() === cleanName.toLowerCase());
            
            if (existingIndex !== -1) {
                if (userScore >= localList[existingIndex].score) {
                    localList[existingIndex] = record;
                }
            } else {
                localList.push(record);
            }
            localList.sort((a, b) => b.score - a.score);
            localStorage.setItem('history_unit11_leaderboard', JSON.stringify(localList));

            // 2. If Cloud available, update Cloud Document
            if (db && isCloudAvailable && auth.currentUser) {
                try {
                    const docId = cleanName.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '_') || 'user_' + Date.now();
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', docId);
                    
                    await setDoc(docRef, record, { merge: true });
                } catch (e) {
                    console.error("Error saving to cloud:", e);
                }
            } else {
                // Render from local
                fallbackLocalLeaderboard();
            }
        };

        function fallbackLocalLeaderboard() {
            const syncStatusEl = document.getElementById('sync-status');
            if (syncStatusEl) {
                syncStatusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-[10px]"></i> 本地自动保存`;
                syncStatusEl.className = "text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200 flex items-center gap-1";
            }
            const localList = JSON.parse(localStorage.getItem('history_unit11_leaderboard') || '[]');
            window.renderLeaderboardUI(localList, "local");
        }
    </script>

            {

                ],
                correct: 1, // B
                explanation: "💡 解析：作为国家文化遗产（Warisan Negara），马来语体现了悠久的历史与文化文明继承。"
            },
            {
                q: "8. 为了鼓励国民尊重与热爱国语，国家语文局（DBP）长期推广的著名国语宣传口号是？",
                options: [
                    "A. 语言是民族的灵魂（Bahasa Jiwa Bangsa）",
                    "B. 勤学国语走向世界",
                    "C. 语言即是科技力量",
                    "D. 知识开创美好未来"
                ],
                correct: 0, // A
                explanation: "💡 解析：“Bahasa Jiwa Bangsa”（语言是民族的灵魂）是国家语文局推广国语的经典宣传口号。"
            },
            {
                q: "9. 国语作为官方语言（Bahasa Rasmi），主要应用在下列哪一个领域？",
                options: [
                    "A. 私人家庭内部的日常会话",
                    "B. 政府机关行政事务、官方仪式与法律文书",
                    "C. 国际跨国企业的内部邮件",
                    "D. 私人社交媒体的休闲聊天"
                ],
                correct: 1, // B
                explanation: "💡 解析：官方语言主要运用于政府机关行政事务、官方正式仪式以及法院法律文书。"
            },
            {
                q: "10. 作为马来西亚公民，我们在日常生活中应当如何展现维护与巩固国语地位的能力与态度？",
                options: [
                    "A. 经常滥用不规范的混杂语言（Bahasa Rojak）",
                    "B. 正确、得体地使用国语，并为国语作为国家遗产感到自豪",
                    "C. 羞于在公开场合使用国语交流",
                    "D. 拒绝接触或学习任何其他语言"
                ],
                correct: 1, // B
                explanation: "💡 解析：我们应当规范、正确地使用国语，尊崇并传承这一代表国家的文化遗产。"
            }

        // State variables
        let studentName = "";
        let studentMoe = "";
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;

        // Sound Synthesizer via Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // Cheerful Arpeggio Tone
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.08);
                        gain.gain.setValueAtTime(0.2, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.3);
                    });
                } else if (type === 'wrong') {
                    // Gentle Oops Tone
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(261.63, now); // C4
                    osc.frequency.setValueAtTime(220.00, now + 0.15); // A3
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'victory') {
                    // Fanfare Chords
                    const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    freqs.forEach((f, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.8);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.8);
                    });
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        // Mascot Reactions
        function updateMascot(avatar, speech) {
            const avatarEl = document.getElementById('mascot-avatar');
            const speechEl = document.getElementById('mascot-speech');
            if (avatarEl && speechEl) {
                avatarEl.innerText = avatar;
                speechEl.innerText = speech;
            }
        }

        function startQuiz() {
            const nameInput = document.getElementById('student-name-input');
            const moeInput = document.getElementById('student-moe-input');
            const nameError = document.getElementById('name-error');
            
            const valName = nameInput.value.trim();
            const valMoe = moeInput.value.trim().toLowerCase();

            // 验证姓名 (中英文均可)
            if (!valName) {
                nameError.innerText = "⚠️ 请填写您的姓名（中文或英文）！";
                nameError.classList.remove('hidden');
                nameInput.focus();
                return;
            }

            // 验证 MOE 账号结尾格式
            if (!valMoe || !valMoe.endsWith('@moe-dl.edu.my')) {
                nameError.innerText = "⚠️ MOE账号格式不正确，结尾必须是 @moe-dl.edu.my！";
                nameError.classList.remove('hidden');
                moeInput.focus();
                return;
            }

            nameError.classList.add('hidden');
            studentName = valName;
            studentMoe = valMoe;

            document.getElementById('display-student-name').innerText = studentName;

            // Switch Screen
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');

            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('current-score').innerText = score;

            updateMascot('😺', `加油，${studentName}！认真看题，相信你一定行！`);
            loadQuestion();
        }

        function loadQuestion() {
            const qData = quizData[currentQuestionIndex];
            selectedOption = null;

            // Update Progress Header
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Question Text
            document.getElementById('question-text').innerText = qData.q;

            // Generate Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl font-bold text-sm sm:text-base text-gray-800 flex items-center justify-between cursor-pointer space-x-2`;
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `
                    <span>${optText}</span>
                    <i class="fa-regular fa-circle text-gray-300 option-icon text-lg"></i>
                `;
                container.appendChild(btn);
            });

            // Reset Feedback Box
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'hidden p-4 rounded-2xl border-2 space-y-1 text-sm';
            
            // Disable Next Button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function selectOption(index) {
            if (selectedOption !== null) return;

            selectedOption = index;
            const qData = quizData[currentQuestionIndex];
            const isCorrect = (index === qData.correct);

            const buttons = document.querySelectorAll('#options-container button');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('cursor-pointer');
            });

            if (isCorrect) {
                score += 1;
                document.getElementById('current-score').innerText = score;
                playSound('correct');
                
                buttons[index].classList.add('correct-anim');
                buttons[index].querySelector('.option-icon').className = 'fa-solid fa-circle-check text-emerald-600 text-xl';
                updateMascot('😸', '太棒了！答对啦！加1分！🌟');
            } else {
                playSound('wrong');
                buttons[index].classList.add('wrong-anim');
                buttons[index].querySelector('.option-icon').className = 'fa-solid fa-circle-xmark text-rose-500 text-xl';

                // Show correct option
                buttons[qData.correct].classList.add('correct-anim');
                buttons[qData.correct].querySelector('.option-icon').className = 'fa-solid fa-circle-check text-emerald-600 text-xl';
                updateMascot('😿', '没关系，看清楚下面的解析，下题继续努力！💪');
            }

            // Show Feedback Box
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackStatus = document.getElementById('feedback-status');
            const feedbackExp = document.getElementById('feedback-explanation');

            feedbackBox.classList.remove('hidden');
            if (isCorrect) {
                feedbackBox.classList.add('bg-emerald-50', 'border-emerald-300');
                feedbackStatus.className = 'font-black flex items-center text-emerald-800 text-base';
                feedbackStatus.innerHTML = `<i class="fa-solid fa-face-smile mr-2 text-xl text-emerald-600"></i> 回答正确！(+1分)`;
            } else {
                feedbackBox.classList.add('bg-rose-50', 'border-rose-300');
                feedbackStatus.className = 'font-black flex items-center text-rose-700 text-base';
                feedbackStatus.innerHTML = `<i class="fa-solid fa-face-frown mr-2 text-xl text-rose-500"></i> 回答错误 (答错不扣分)`;
            }

            feedbackExp.innerText = qData.explanation;

            // Enable Next Button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
                updateMascot('😻', `第 ${currentQuestionIndex + 1} 题来啰！仔细看题！`);
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            document.getElementById('final-student-name').innerText = studentName;
            document.getElementById('final-score').innerText = score;

            const evalText = document.getElementById('result-evaluation');
            const resultEmoji = document.getElementById('result-emoji');
            const resultTitle = document.getElementById('result-title');

            if (score === 10) {
                resultEmoji.innerText = '🏆';
                resultTitle.innerText = '满分！超级大师！';
                evalText.innerText = '🌟 太厉害了！你对国语历史知识掌握得非常透彻！';
                updateMascot('👑', '全对满分！你简直是历史小达人！为你骄傲！');
                playSound('victory');
                triggerConfetti();
            } else if (score >= 7) {
                resultEmoji.innerText = '🎉';
                resultTitle.innerText = '太赞了！优秀成绩！';
                evalText.innerText = '👏 很棒的表现！对国语的功用理解得非常深刻！';
                updateMascot('😺', '考得非常出色！继续保持这种学习热情哦！');
                playSound('victory');
            } else if (score >= 5) {
                resultEmoji.innerText = '👍';
                resultTitle.innerText = '表现不错！顺利通过！';
                evalText.innerText = '💪 掌握得挺好，复习一下错题会更完美！';
                updateMascot('😸', '很棒！多看两遍解析，下次挑战满分！');
            } else {
                resultEmoji.innerText = '📖';
                resultTitle.innerText = '继续加油，再接再厉！';
                evalText.innerText = '📚 别灰心，重新阅读课本后再试一次吧！';
                updateMascot('🐱', '别灰心，熟能生巧！再试一次一定进步！');
            }

            // Save to Cloud & Local Storage with MOE Account
            if (typeof window.saveScoreToCloud === 'function') {
                window.saveScoreToCloud(studentName, studentMoe, score);
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // Render Leaderboard Function (Global)
        window.renderLeaderboardUI = function(list, source) {
            const container = document.getElementById('leaderboard-list');
            if (!container) return;

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4 font-bold">暂无纪录，快成为第一位榜首吧！</p>`;
                return;
            }

            container.innerHTML = '';
            list.slice(0, 15).forEach((entry, idx) => {
                let badge = `<span class="w-6 text-center font-black text-gray-500 text-xs">${idx + 1}</span>`;
                if (idx === 0) badge = `<span class="w-6 text-center text-lg">🥇</span>`;
                if (idx === 1) badge = `<span class="w-6 text-center text-lg">🥈</span>`;
                if (idx === 2) badge = `<span class="w-6 text-center text-lg">🥉</span>`;

                const isCurrentPlayer = (entry.name && entry.name.toLowerCase() === studentName.toLowerCase());

                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2.5 rounded-2xl text-xs sm:text-sm font-bold ${
                    isCurrentPlayer ? 'bg-amber-100 border-2 border-amber-400 shadow-sm' : 'bg-slate-50 border border-slate-100'
                }`;
                row.innerHTML = `
                    <div class="flex items-center space-x-2">
                        ${badge}
                        <span class="text-gray-800 ${isCurrentPlayer ? 'font-black text-amber-950' : ''}">${escapeHtml(entry.name || '无名小达人')}</span>
                        ${isCurrentPlayer ? '<span class="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-black">你</span>' : ''}
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-black text-amber-600 bg-white px-2 py-0.5 rounded-lg border border-amber-200">${entry.score} 分</span>
                        <span class="text-gray-400 text-[10px]">${entry.date || ''}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        };

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function restartQuiz() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('current-score').innerText = score;
            updateMascot('😺', '重新开始啦，这次一定要挑战更高分！');
            loadQuestion();
        }

        function newStudent() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-welcome').classList.remove('hidden');
            document.getElementById('student-name-input').value = '';
            document.getElementById('student-moe-input').value = '';
            updateMascot('🐱', '欢迎新同学！请输入姓名和MOE账号开启练习吧！');
        }
    </script>
